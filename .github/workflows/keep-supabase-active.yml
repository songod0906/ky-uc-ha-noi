name: Keep Supabase active

on:
  schedule:
    # Supabase free projects pause after a week with too little activity.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a public Supabase asset
        env:
          SUPABASE_ASSET_URL: https://mcbwpmptykgjlwksokic.supabase.co/storage/v1/object/public/assets/tours/ltk/truoc-cong-truong/shot-01.jpg
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            status="$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              --range 0-0 \
              --write-out '%{http_code}' \
              "$SUPABASE_ASSET_URL" || true)"

            case "$status" in
              2??|3??)
                echo "Supabase responded with HTTP $status on attempt $attempt."
                exit 0
                ;;
              *)
                echo "Supabase ping returned HTTP ${status:-000} on attempt $attempt."
                ;;
            esac

            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          exit 1
